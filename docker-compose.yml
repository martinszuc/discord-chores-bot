services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-chores-bot:latest
    container_name: discord-chores-bot
    restart: unless-stopped

    network_mode: "host"

    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9

    dns_opt:
      - ndots:1
      - timeout:3
      - attempts:2

    dns_search: []

    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./music:/app/music

    environment:
      - TZ=Europe/Bratislava
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - PYTHONUNBUFFERED=1

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 2m
      timeout: 30s
      retries: 5
      start_period: 30s

    mem_limit: "1g"
    mem_reservation: "512m"
    memswap_limit: "1g"
