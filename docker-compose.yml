services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit cache mounts are enabled via DOCKER_BUILDKIT=1 environment variable
    image: discord-chores-bot:latest
    container_name: discord-chores-bot
    restart: unless-stopped

    # DNS configuration
    dns:
      - 192.168.50.69
      - 9.9.9.9          # Quad9
      - 8.8.8.8          # Google
      - 1.1.1.1          # Cloudflare

    # DNS options for faster failover
    dns_opt:
      - ndots:1
      - timeout:2        # Fail fast if DNS is down
      - attempts:3       # Try 3 times before moving to next DNS

    dns_search: []       # Prevent unnecessary search domain queries

    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./music:/app/music

    environment:
      - TZ=Europe/Bratislava
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - PYTHONUNBUFFERED=1

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 2m
      timeout: 30s
      retries: 5
      start_period: 30s

    # Memory limits
    mem_limit: "512m"
    mem_reservation: "256m"
    memswap_limit: "512m"

    # Network configuration
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: bot_bridge
